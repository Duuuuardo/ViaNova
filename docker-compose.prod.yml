name: vianova-prod

networks:
  novaplatform:
    external: true
  # Rede interna isolada: banco, Redis e MinIO só são alcançáveis pelos
  # serviços do Vianova que se conectam explicitamente a ela.
  vianova-internal:
    driver: bridge
    internal: true

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vianova
      POSTGRES_USER: vianova
      POSTGRES_PASSWORD: ${VIANOVA_POSTGRES_PASSWORD}
    volumes:
      - vianova_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vianova -d vianova"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vianova-internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${VIANOVA_REDIS_PASSWORD}"]
    volumes:
      - vianova_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${VIANOVA_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vianova-internal

  minio:
    image: minio/minio:RELEASE.2025-07-17T22-54-18Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - vianova_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vianova-internal

  api:
    image: ${REGISTRY}/vianova-api:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    networks:
      novaplatform:
        aliases:
          - vianova-api
      vianova-internal:
    env_file:
      - ./.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    image: ${REGISTRY}/vianova-web:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      novaplatform:
        aliases:
          - vianova-web
    env_file:
      - ./.env
    depends_on:
      - api

  landing:
    image: ${REGISTRY}/vianova-landing:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3300:3300"
    networks:
      novaplatform:
        aliases:
          - vianova-landing
    env_file:
      - ./.env

  # Config server: em produção fica apenas na rede interna e no loopback.
  # NUNCA adicione um server_name/config.vianova.software público para ele.
  config-server:
    image: ${REGISTRY}/vianova-config-server:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5100:5100"
    networks:
      novaplatform:
        aliases:
          - vianova-config-server
      vianova-internal:
    env_file:
      - ./.env
    volumes:
      - ./apps/config-server/config:/app/apps/config-server/config:ro
    depends_on:
      - api

  email-worker:
    image: ${REGISTRY}/vianova-email-worker:latest
    restart: unless-stopped
    env_file:
      - ./.env
    networks:
      - vianova-internal
    depends_on:
      redis:
        condition: service_healthy

volumes:
  vianova_postgres_data:
  vianova_redis_data:
  vianova_minio_data:
