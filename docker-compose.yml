services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_DB: vianova
      POSTGRES_USER: vianova
      POSTGRES_PASSWORD: ${VIANOVA_POSTGRES_PASSWORD}
    volumes:
      - vianova_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vianova -d vianova"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    command: ["redis-server", "--requirepass", "${VIANOVA_REDIS_PASSWORD}"]
    volumes:
      - vianova_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${VIANOVA_REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-07-17T22-54-18Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9100:9000" # S3 API
      - "127.0.0.1:9101:9001" # Console
    environment:
      MINIO_ROOT_USER: ${VIANOVA_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${VIANOVA_MINIO_ROOT_PASSWORD}
    volumes:
      - vianova_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Cria os buckets do Vianova na primeira subida e encerra.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${VIANOVA_MINIO_ROOT_USER} ${VIANOVA_MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/vianova-avatars &&
      mc mb --ignore-existing local/vianova-files
      "

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1026:1025" # SMTP
      - "127.0.0.1:8026:8025" # Web UI

  email-worker:
    image: oven/bun:1.3.14
    restart: unless-stopped
    command: ["bun", "run", "--cwd", "apps/email-worker", "dev"]
    working_dir: /app
    volumes:
      - .:/app
      - ./.env:/app/.env:ro
    environment:
      - VIANOVA_REDIS_URL=redis://:${VIANOVA_REDIS_PASSWORD}@redis:6379
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
    depends_on:
      redis:
        condition: service_healthy

  # Config server: em dev expõe na loopback; em produção NÃO deve ser exposto
  # publicamente — só via rede interna.
  config-server:
    image: oven/bun:1.3.14
    restart: unless-stopped
    command: ["bun", "run", "--cwd", "apps/config-server", "dev"]
    working_dir: /app
    volumes:
      - .:/app
      - ./.env:/app/.env:ro
    ports:
      - "127.0.0.1:5100:5100"
    environment:
      - PORT=5100
      - VIANOVA_INTERNAL_SECRET=${VIANOVA_INTERNAL_SECRET}
    depends_on:
      - api

volumes:
  vianova_postgres_data:
  vianova_redis_data:
  vianova_minio_data:
